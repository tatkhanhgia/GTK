services:
  app:
    image: ${APP_IMAGE:-gtkblog-app:local}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gtkblog:gtkblog@postgres:5432/gtkblog
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-unknown}
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gtkblog
      POSTGRES_PASSWORD: gtkblog
      POSTGRES_DB: gtkblog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtkblog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
