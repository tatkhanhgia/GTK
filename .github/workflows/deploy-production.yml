name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gtkblog

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gtkblog
          POSTGRES_PASSWORD: gtkblog
          POSTGRES_DB: gtkblog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtkblog -d gtkblog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://gtkblog:gtkblog@localhost:5432/gtkblog_ci
      PAYLOAD_SECRET: ci-payload-secret-32-chars-long-enough
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_test_mock
      SEPAY_WEBHOOK_SECRET: sepay_test_secret
      RESEND_API_KEY: re_test_mock
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap database
        run: npm run db:bootstrap

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint source
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SKIP_ADMIN_TRANSLATION_GENERATION: 'true'
          SKIP_BUILD_DB_ACCESS: 'true'
          SKIP_DB_TRANSLATIONS: 'true'

      - name: Build Docker image
        run: docker build -t gtkblog-ci:${{ github.sha }} .

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish-image

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/known_hosts <<'EOF'
          ${{ secrets.VPS_KNOWN_HOSTS }}
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            set -euo pipefail

            cd "${{ secrets.VPS_PROJECT_PATH }}"

            git fetch origin "+refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
            git reset --hard "${{ github.sha }}"
            git merge-base --is-ancestor "${{ github.sha }}" "refs/remotes/origin/${{ github.ref_name }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            bash scripts/backup-production-db.sh

            printf 'APP_IMAGE=%s\nGIT_COMMIT_SHA=%s\n' "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${{ github.sha }}" > .env.deploy
            set -a
            . ./.env.deploy
            set +a

            cleanup_gtkblog_docker_images() {
              printf 'Docker disk usage before cleanup:\n'
              docker system df || true

              docker images "${{ env.IMAGE_NAME }}" --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
                | awk -v keep="${APP_IMAGE}" '$1 != keep { print $2 }' \
                | sort -u \
                | xargs -r docker rmi || true

              docker image prune -f || true
              docker builder prune -af || true

              printf 'Docker disk usage after cleanup:\n'
              docker system df || true
            }

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cleanup_gtkblog_docker_images
            docker compose pull app
            docker compose up -d --no-build app
            cleanup_gtkblog_docker_images

            printf 'Deployed image: %s\n' "${APP_IMAGE}"
            printf 'Deployed commit: %s\n' "${GIT_COMMIT_SHA}"
            docker compose ps
          EOF

      - name: Health check
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            set -euo pipefail

            cd "${{ secrets.VPS_PROJECT_PATH }}"

            for attempt in {1..30}; do
              if docker compose exec -T app node -e '
                const expected = process.argv[1]
                fetch("http://127.0.0.1:3000/api/health")
                  .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
                  .then((health) => {
                    if (health.ok === true && health.database === "ok" && health.version === expected) process.exit(0)
                    console.error(JSON.stringify(health))
                    process.exit(1)
                  })
                  .catch((error) => {
                    console.error(error.message)
                    process.exit(1)
                  })
              ' "${{ github.sha }}" < /dev/null; then
                printf 'Health check passed on attempt %s\n' "${attempt}"
                exit 0
              fi
              sleep 5
            done

            printf 'Health check failed after retries\n' >&2
            docker compose ps >&2 || true
            docker compose logs --tail=200 app >&2 || true
            exit 1
          EOF

      - name: Smoke test critical routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ secrets.PRODUCTION_URL }}"
          for path in "/" "/en" "/admin"; do
            curl --fail --silent --show-error --output /dev/null "${base_url}${path}"
          done
