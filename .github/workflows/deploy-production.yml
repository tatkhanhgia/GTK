name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gtkblog
          POSTGRES_PASSWORD: gtkblog
          POSTGRES_DB: gtkblog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtkblog -d gtkblog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://gtkblog:gtkblog@localhost:5432/gtkblog_ci
      PAYLOAD_SECRET: ci-payload-secret-32-chars-long-enough
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_test_mock
      SEPAY_WEBHOOK_SECRET: sepay_test_secret
      RESEND_API_KEY: re_test_mock
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap database
        run: npm run db:bootstrap

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint source
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SKIP_ADMIN_TRANSLATION_GENERATION: 'true'
          SKIP_BUILD_DB_ACCESS: 'true'
          SKIP_DB_TRANSLATIONS: 'true'

      - name: Build Docker image
        run: docker build -t gtkblog-ci:${{ github.sha }} .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/known_hosts <<'EOF'
          ${{ secrets.VPS_KNOWN_HOSTS }}
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            set -euo pipefail

            cd "${{ secrets.VPS_PROJECT_PATH }}"

            git fetch origin "+refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
            git reset --hard "${{ github.sha }}"
            git merge-base --is-ancestor "${{ github.sha }}" "refs/remotes/origin/${{ github.ref_name }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            bash scripts/backup-production-db.sh
            npm run db:deploy

            printf 'GIT_COMMIT_SHA=%s\n' "${{ github.sha }}" > .env.deploy
            set -a
            . ./.env.deploy
            set +a

            docker compose up -d --build
            docker image prune -f

            printf 'Deployed commit: %s\n' "${{ github.sha }}"
            docker compose ps
          EOF

      - name: Health check
        shell: bash
        run: |
          for attempt in {1..30}; do
            health_json="$(curl --fail --silent --show-error "${{ secrets.PRODUCTION_URL }}/api/health" || true)"
            if echo "${health_json}" | jq --exit-status --arg version "${{ github.sha }}" \
              '.ok == true and .database == "ok" and .version == $version' > /dev/null; then
              printf 'Health check passed on attempt %s\n' "${attempt}"
              exit 0
            fi
            sleep 5
          done

          printf 'Health check failed after retries\n' >&2
          exit 1

      - name: Smoke test critical routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ secrets.PRODUCTION_URL }}"
          for path in "/" "/en" "/admin"; do
            curl --fail --silent --show-error --output /dev/null "${base_url}${path}"
          done
