name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: true  # Don't fail build on lint warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_test_mock
          SEPAY_WEBHOOK_SECRET: sepay_test_secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          PAYLOAD_SECRET: test-secret-32-chars-long-enough-x
          RESEND_API_KEY: re_test_mock

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: 1
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          PAYLOAD_SECRET: test-secret-32-chars-long-enough-x
          STRIPE_SECRET_KEY: sk_test_mock
          RESEND_API_KEY: re_test_mock
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        continue-on-error: true  # Build may fail without real DB
